<!DOCTYPE html>
<html lang="en">
<head>

<title>TAP THE TRUTH</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2fa;--ink:#0d1b34;--mut:#4f5c76;--card:#fff;--line:#cfd8ea;--edge:#0d1b34;--blue:#123f8c;--gold:#f0b400;--ok:#0f8a52;--bad:#c62833;--grid:rgba(18,63,140,.07);--g1:rgba(240,180,0,.22);--g2:rgba(18,63,140,.13);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06122a;--ink:#eaf0fb;--mut:#9fb0cc;--card:#0d1f45;--line:#1d3566;--edge:#3a5ca6;--blue:#7fa8f5;--ok:#4cd08e;--bad:#ff7b72;--grid:rgba(127,168,245,.08);--g1:rgba(240,180,0,.12);--g2:rgba(60,110,255,.2)}}
:root[data-theme="dark"]{--bg:#06122a;--ink:#eaf0fb;--mut:#9fb0cc;--card:#0d1f45;--line:#1d3566;--edge:#3a5ca6;--blue:#7fa8f5;--ok:#4cd08e;--bad:#ff7b72;--grid:rgba(127,168,245,.08);--g1:rgba(240,180,0,.12);--g2:rgba(60,110,255,.2)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);color:var(--ink);font:400 1.02rem/1.6 "DM Sans",system-ui,sans-serif;background-image:radial-gradient(48rem 26rem at 90% -8%,var(--g1),transparent 65%),radial-gradient(40rem 26rem at -8% 30%,var(--g2),transparent 65%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,auto,32px 32px,32px 32px}
h1,h2,h3,.ui{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:14px 18px;max-width:880px;margin:auto}
header>a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 1.15rem "Bricolage Grotesque",sans-serif}
.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--gold);color:#0d1b34;border:2px solid var(--edge);font:800 1.2rem "Bricolage Grotesque",sans-serif;box-shadow:2px 2px 0 var(--edge)}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
nav a{padding:5px 11px;border-radius:99px;border:2px solid transparent;font-weight:700;font-size:.86rem;color:var(--ink);text-decoration:none}
nav a:hover{border-color:var(--edge);background:var(--gold);color:#0d1b34}
main{max-width:880px;margin:auto;padding:8px 18px 56px}
.hero{position:relative;padding:26px 0 14px}
.hero>*{position:relative;z-index:1}
.hero .candles{position:absolute;z-index:0;right:0;top:6px;width:min(46%,320px);opacity:.4;pointer-events:none}
.chip{display:inline-block;border:2px solid var(--edge);background:var(--card);border-radius:99px;padding:3px 12px;font:700 .85rem "Bricolage Grotesque",sans-serif;margin-bottom:10px}
.hero h1{font-size:clamp(3rem,13vw,6.4rem);line-height:.92;margin:0 0 14px;font-weight:800;letter-spacing:-.03em}
.hero h1 mark{display:inline-block;background:var(--gold);color:#0d1b34;padding:0 .14em;border-radius:.14em;transform:rotate(-1.5deg)}
.hero p{max-width:34em;color:var(--mut);font-size:1.12rem}
.tapbtn{position:relative;display:inline-flex;align-items:center;gap:12px;background:var(--gold);color:#0d1b34;border:2px solid var(--edge);border-radius:999px;padding:14px 26px;font:800 1.08rem "Bricolage Grotesque",sans-serif;cursor:pointer;text-decoration:none;box-shadow:5px 5px 0 var(--edge);transition:transform .15s,box-shadow .15s}
.tapbtn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--edge)}
.tapbtn:after{content:"";position:absolute;inset:-7px;border:2px solid var(--gold);border-radius:999px;animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{transform:scale(.94);opacity:1}100%{transform:scale(1.14);opacity:0}}
@media(prefers-reduced-motion:reduce){.tapbtn:after{animation:none;opacity:.6}}
.flow{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0;padding:0;list-style:none}
.flow li{border:2px solid var(--edge);background:var(--card);border-radius:99px;padding:5px 14px;font:700 .9rem "Bricolage Grotesque",sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:16px}
.tile{display:block;background:var(--card);border:2px solid var(--edge);border-left:10px solid var(--c);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);box-shadow:5px 5px 0 var(--edge);transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--c)}
.tile b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.1rem;display:block}
.tile span{color:var(--mut);font-size:.93rem;display:block}
.tile em{display:inline-block;margin-top:4px;font:700 .82rem "Bricolage Grotesque",sans-serif;font-style:normal;color:#0d1b34;background:#4cd08e;border-radius:99px;padding:1px 10px}
.bar{height:16px;background:var(--card);border:2px solid var(--edge);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--gold) 0 10px,#ffd24d 10px 20px);width:0;transition:width .4s}
.panel{background:var(--card);border:2px solid var(--edge);border-radius:16px;padding:20px 22px;margin:18px 0;box-shadow:5px 5px 0 var(--edge)}
.panel h2{margin:0 0 6px;font-size:1.3rem}
.stage{display:inline-block;background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 10px;font:700 .9rem "Bricolage Grotesque",sans-serif;margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;background:var(--bg);border:2px solid var(--edge);border-radius:12px;color:var(--ink);font:inherit;cursor:pointer;transition:transform .12s}
.opt:hover:not(:disabled){transform:translateX(4px);background:color-mix(in srgb,var(--gold) 18%,var(--bg))}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--bg))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--bg))}
.fb{margin-top:8px;font-size:.98rem}
input[type=number],input[type=text],input[type=email]{padding:8px 10px;border:2px solid var(--edge);border-radius:10px;background:var(--bg);color:var(--ink);width:18em;max-width:100%;font:inherit;margin:4px 12px 4px 0}
input[type=number]{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:700}
label{display:block}
.stack{display:flex;height:34px;border:2px solid var(--edge);border-radius:10px;overflow:hidden;margin:10px 0}
.stack i{display:block;height:100%}
.legend span{display:inline-block;margin-right:14px;font:600 .9rem "Bricolage Grotesque",sans-serif}
.legend b{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
select{padding:8px;border:2px solid var(--edge);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
details summary{cursor:pointer}
textarea{width:100%;min-height:110px;padding:12px;border:2px solid var(--edge);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
button.sec,a.sec{display:inline-block;margin:8px 8px 0 0;padding:9px 16px;border-radius:99px;border:2px solid var(--edge);background:var(--card);color:var(--ink);font:700 .93rem "Bricolage Grotesque",sans-serif;cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--edge);transition:transform .12s,box-shadow .12s}
button.sec:hover:not(:disabled),a.sec:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--edge);background:var(--gold);color:#0d1b34}
.sec[aria-pressed="true"]{background:var(--gold);color:#0d1b34}
.opt[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,var(--bg))}
.sec:disabled,.opt:disabled{cursor:default}
.tag{display:inline-block;background:var(--c);color:#111;border:2px solid #0d1b34;border-radius:99px;padding:1px 12px;font:800 .85rem "Bricolage Grotesque",sans-serif}
.qc{background:#fff;color:#111;border:1px solid var(--line);border-top:8px solid var(--c);border-radius:10px;padding:12px;text-align:center;break-inside:avoid}
.qc div.q{display:flex;justify-content:center;margin:8px 0}
.qc small{display:block;word-break:break-all;font:.7rem monospace;color:#444}
.scroll{overflow-x:auto}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.hubc{display:block;background:var(--gold);color:#0d1b34;border:2px solid var(--edge);border-radius:14px;padding:12px 14px;text-decoration:none;box-shadow:4px 4px 0 var(--edge);font:800 1.05rem "Bricolage Grotesque",sans-serif}
.hubc small{display:block;font:500 .85rem "DM Sans",sans-serif;margin-top:2px}
.hubc:hover{transform:translate(-2px,-2px)}
.fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.flip{min-height:96px;padding:10px;border:2px solid var(--edge);border-radius:14px;background:var(--bg);color:var(--ink);font:800 1rem "Bricolage Grotesque",sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--edge)}
.flip.on{background:var(--gold);color:#0d1b34;font:500 .85rem/1.35 "DM Sans",sans-serif;text-align:left}
input[type=range]{width:100%;accent-color:var(--gold)}
.btm{display:none}
@media(max-width:700px){header nav{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px}header nav a{white-space:nowrap}body{padding-bottom:76px}
.btm{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:space-around;background:var(--card);border-top:2px solid var(--edge);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.btm a{display:grid;justify-items:center;gap:0;min-width:56px;padding:4px 8px;border-radius:12px;text-decoration:none;color:var(--ink);font:700 .72rem "Bricolage Grotesque",sans-serif}
.btm a span{font-size:1.25rem}.btm a[aria-current]{background:var(--gold);color:#0d1b34}}
@media print{header,.noprint{display:none}body{background:#fff}.panel,.tile{box-shadow:none}}
</style>
</head>

<footer class="noprint" style="max-width:880px;margin:auto;padding:0 18px 30px;color:var(--mut);font-size:.9rem">Educational student project. Not an official Commission on Audit product. Always check figures against the cited source.</footer>
<script>
var T=[
{c:"#2f6fdb",n:"What's the Truth?",s:"Why flood control budgets get audited",d:"Flood control means structures like riverbank protection, flood walls and drainage. Its budget grew fast: one UP CIDS policy paper reports appropriations rose from about ₱79 billion in 2016 to over ₱200 billion a year by 2021. After public concern about 'ghost projects', COA Chairperson Gamaliel Cordoba ordered on 12 August 2025 a fraud audit of all DPWH flood control projects in Bulacan from 1 July 2022 to 30 May 2025.",k:["Flood control is public money for public safety, so the public must be able to verify it","COA's fraud audit asks: did the structure exist, was it built where contracted, and were payments supported?","Bulacan alone accounted for about ₱98 billion, roughly 18%, of DPWH flood control projects for 2022 to 2025, per Cordoba"],links:[["News: COA fraud audit order (GMA)","https://www.gmanetwork.com/news/topstories/nation/956150/coa-audit-bulacan-flood-control/story/"],["UP CIDS: Flood-Control Fiasco","https://cids.up.edu.ph/flood-control-fiasco-a-policy-reckoning-for-accountability-in-the-philippines/"]],qs:[{q:"COA's fraud audit of Bulacan flood control projects covered which period?",o:["1 Jan 2020 to 31 Dec 2021","1 July 2022 to 30 May 2025","2010 to 2014","Only 2025"],a:1,e:"The audit directive covered DPWH flood control projects from 1 July 2022 to 30 May 2025."},{q:"Why does a flood control budget need independent auditing?",o:["It is small and simple","It is large public money that people cannot easily verify on their own","Because engineers ask for it","Only for tax reasons"],a:1,e:"Large, technical, public-safety spending is hard for citizens to verify, so independent auditors check it."}],u:"A flood wall you cannot see being built is easy to pay for and hard to check. Auditing exists to close that gap.",w:"Flood control is also where budget size, project location and contractor payments all meet, which makes it a good case for learning how public budgets work.",act:"Pick a flood-prone place you know.",as:["Write down one flood control structure near you (or one that should exist).","List three questions you would ask before agreeing its budget was well spent."]},
{c:"#1f9d55",n:"Know COA",s:"How COA audits flood control projects",d:"COA used physical inspections, drone surveillance, geotagged photographs and historical satellite imagery to test flood control projects. It reported patterns such as ghost projects, unauthorized relocation of project sites, payments for pre-existing structures and serious documentation gaps. It filed fraud audit reports with the Ombudsman and the Independent Commission for Infrastructure (since defunct), and issued notices of disallowance where its fraud audits supported them. More recently Cordoba said fraud audits covered almost 50 projects, focused on DPWH and its Bulacan personnel.",k:["Satellite imagery can show whether a structure existed before the contract took effect","Geotagged photos and drone views test location and existence","Notice of disallowance: COA's action refusing a payment it finds improper"],links:[["News: COA findings, Jan 2026 (Inquirer)","https://newsinfo.inquirer.net/2170541/coa-latest-report-on-flood-control-projects"],["News: nearly 50 projects under fraud audit (GMA)","https://www.gmanetwork.com/news/topstories/nation/1001021/bulacan-flood-control-fraud-audits-found-no-link-to-villanueva-says-coa/story/"]],qs:[{q:"How can COA test whether a riverbank structure already existed before a contract began?",o:["Ask the contractor","Review historical satellite imagery","Read the budget speech","Count the invoices"],a:1,e:"COA reported using historical satellite imagery for exactly this."},{q:"What is a notice of disallowance?",o:["A bonus for agencies","COA's action refusing a payment it finds improper","A new contract","A tax bill"],a:1,e:"Disallowance means the expense is not allowed in the accounts, and responsible persons may have to return it."}],u:"Modern audits combine field checks with technology. A signed document is no longer enough proof that something was built.",w:"COA's Fraud Audit Office files its findings so that other bodies can act. Audit findings become evidence, not verdicts.",act:"Match the tool to the question.",as:["Write which tool (drone, satellite image, geotagged photo, documents) best answers: 'Does it exist?', 'Is it in the right place?', 'Was it there before the contract?'","Explain in one sentence why one tool alone is not enough."]},
{c:"#e0a800",n:"Know the Rules",s:"The budget cycle and flood control rules",d:"Budget path: DBM prepares the National Expenditure Program (NEP) and it goes to Congress. Congress amends it, the bicameral conference committee reconciles both houses, the President signs the General Appropriations Act (GAA), and DBM releases funds based on what the GAA itemizes. DPWH then plans, bids and builds, and COA audits. Watchdogs have flagged 'insertions', where GAA amounts far exceed the NEP: an Inquirer report cites a DPWH program that requested ₱174.08B in the 2024 NEP but received ₱410.9B in the GAA.",k:["NEP (proposal) → Congress → Bicam → GAA (law) → DBM release → DPWH implements → COA audits","The 2026 GAA DPWH provisions require satellite-based, geospatial validation of flood control projects with a dashboard shared with DBM, DEPDev and COA","It also requires DPWH to publish original vs updated project costs with justification"],links:[["2026 GAA: DPWH provisions (DBM)","https://www.dbm.gov.ph/wp-content/uploads/GAA/GAA2026/VolumeIB/DPWH/DPWH.pdf"],["News: 'insertions' explained (Inquirer)","https://plus.inquirer.net/news/beyond-flood-mess-more-dpwh-insertions-tagged/"]],qs:[{q:"Which is the correct order?",o:["GAA → NEP → Bicam → COA","NEP → Congress deliberation → Bicam → GAA → release","COA audit → NEP → GAA","Release → NEP → GAA"],a:1,e:"The executive proposes (NEP), Congress amends and reconciles, the GAA becomes law, then funds are released."},{q:"Who releases funds according to what the GAA itemizes?",o:["COA","DBM","The contractor","The Ombudsman"],a:1,e:"DBM said it releases funds based on what Congress approved in the budget law."}],u:"Each stage is a checkpoint. Problems can enter at proposal, amendment, release, bidding or building, so auditors look at all of them.",w:"The 2026 GAA now wires COA into a geospatial dashboard. Rules are changing to make verification routine, not exceptional.",act:"Find the checkpoint.",as:["Draw the six-step budget path on paper.","Mark the step where you think a wasteful project is easiest to slip in, and explain why in two sentences."]},
{c:"#f2771a",n:"Follow the Money",s:"The numbers behind flood control budgets",d:"2026 NEP: DPWH proposed ₱881.31B. Locally funded flood control projects worth ₱263.54B were excluded, and the final 2026 GAA gave DPWH ₱530.89B, which is ₱350.42B (nearly 40%) lower than the proposal. Only foreign-assisted flood control projects (which need counterpart funds) stayed, plus about ₱2.49B for maintenance of existing flood control facilities. For 2027, DBM's proposal includes about ₱107.4B for flood control, around 16% of DPWH's proposed ₱644B.",k:["₱881.31B proposed → ₱530.89B enacted (2026)","₱2.49B maintenance for existing flood works in 2026","₱107.4B flood control proposed in 2027, about 16% of DPWH's ₱644B"],tool:"gap",links:[["PIA: DPWH 2026 budget","https://pia.gov.ph/news/dpwh-pushes-transparent-infrastructure-spending-under-2026-budget/"],["Manila Bulletin: 2027 flood control funds","https://mb.com.ph/2026/08/11/dbm-chief-de-leon-explains-why-flood-control-funds-were-restored-in-2027-budget"]],qs:[{q:"By how much was the 2026 GAA for DPWH below its NEP proposal (₱881.31B vs ₱530.89B)?",o:["₱150.42B","₱350.42B","₱550.42B","₱35.04B"],a:1,e:"881.31 − 530.89 = 350.42 billion."},{q:"A ₱107.4B flood control budget within a ₱644B DPWH budget is roughly...",o:["1.6%","16%","60%","160%"],a:1,e:"107.4 ÷ 644 ≈ 0.167, so about 16 to 17%."},{q:"A project costs ₱55M, is recorded 100% paid, but only 20% is verified built on site. What is the unsupported amount?",o:["₱11M","₱44M","₱55M","₱0"],a:1,e:"Paid ₱55M minus verified value ₱11M = ₱44M needing explanation."}],u:"Budget totals tell you the scale. The gap between amount paid and value verified on site tells you the risk.",w:"COA reported cases where nearly all of a contract was paid while the structure was missing, relocated or already existed. That is why 'percent paid' must be matched to 'percent verified'.",act:"Compute a gap.",as:["Use the calculator above with a project you invent or a figure from a news report.","Write what documents the agency would need to close the gap."]},
{c:"#d7263d",n:"Show the Receipts",s:"Documents that prove a flood control project",d:"COA said 'egregious' documentation gaps undermined the credibility of reported accomplishments and payments. In Bulacan, the DPWH 1st District Engineering Office did not submit key supporting documents to COA, and contractors failed to submit disbursement vouchers, so notices of disallowance were issued. Without receipts and records, nobody can verify what was paid for.",k:["Supporting documents are the audit trail","Missing vouchers and records can lead to disallowance","Evidence must match the physical structure on site"],tool:"docs",links:[["News: missing records in fraud audit reports (Philstar)","https://www.philstar.com/headlines/2025/09/26/2475638/coa-files-p360-m-fraudulent-bulacan-flood-control-projects-ici"],["News: COA files with Ombudsman (Inquirer)","https://newsinfo.inquirer.net/2106272/coa-files-in-ombudsman-fraud-audit-report-on-bulacan-flood-control-projects"],["COA: Annual Audit Reports","https://www.coa.gov.ph/reports/annual-audit-reports/"]],qs:[{q:"What happened when contractors did not submit disbursement vouchers, per COA?",o:["Nothing","Notices of disallowance were issued","Contracts were doubled","Audits were cancelled"],a:1,e:"COA reported issuing notices of disallowance partly because vouchers were not submitted."},{q:"Which is the strongest red flag?",o:["A late report","Satellite images showing the structure existed years before the contract","A long project title","A new logo"],a:1,e:"Paying for a pre-existing structure means public funds may have paid for work that was not newly built."}],u:"A receipt only helps if it can be matched to something real. Records and reality must agree.",w:"The 2026 GAA also requires DPWH to publish revised project costs with justifications, so more of this trail is meant to be public.",act:"Build a checklist.",as:["Tick the checklist above for a project you know (or imagine).","Circle the document you think is most often missing and say why."]},
{c:"#8e44ad",n:"Who's Accountable?",s:"Case: four Bulacan projects COA flagged",d:"Case from COA's reports, as covered by media: a ₱96.4M river structure in Calumpit had a ₱38.4M pricing discrepancy between DPWH and COA's evaluation; a ₱39M Plaridel structure was found overpaid by ₱3M and substandard; a ₱55M river wall in Baliuag had no construction found on site; a ₱96.49M riverbank structure in Guiguinto appeared built elsewhere without authority. COA named DPWH district engineers and contractors as responsible and said charges could include graft, malversation and falsification. These are audit findings; cases are for the proper courts and the Ombudsman to decide.",k:["Accountability is by role: engineers who certify, officials who approve, contractors who bill","COA findings are evidence for the Ombudsman and courts","Possible charges cited: Anti-Graft law, malversation of public funds, falsification of documents"],links:[["News: first fraud audit report filed with Ombudsman (Inquirer)","https://newsinfo.inquirer.net/2106272/coa-files-in-ombudsman-fraud-audit-report-on-bulacan-flood-control-projects"],["News: new fraud audit reports, Nov 2025 (Daily Tribune)","https://tribune.net.ph/2025/11/12/dpwh-bulacan-hit-by-new-p344m-flood-cases"]],qs:[{q:"In the Plaridel case, what was found?",o:["A perfect structure","Overpayment of ₱3M and substandard work","A missing budget","No contractor"],a:1,e:"COA found the government overpaid by ₱3M and the work was substandard."},{q:"Who does COA say should be held accountable in these cases?",o:["Only citizens","DPWH district officials and contractors, depending on their roles","Only the weather","No one"],a:1,e:"COA named DPWH engineers and contractor representatives for specific projects."},{q:"COA's fraud audit findings are best described as...",o:["Final court verdicts","Evidence submitted for Ombudsman action","Optional advice","Marketing"],a:1,e:"They form part of the evidentiary record for other bodies to decide."}],u:"Accountability names roles and evidence. It does not replace due process.",w:"Being precise matters: 'COA found' and 'a court convicted' are very different statements.",act:"Assign responsibility fairly.",as:["For one case above, list who certified, who paid, who built.","State what evidence you would still need before saying anyone is guilty."]},
{c:"#8d6e63",n:"Can You Find It?",s:"Checking flood control spending yourself",d:"Public information is only useful if you can locate it. The 2026 GAA requires an online dashboard of satellite-based validation of flood control projects, shared with DBM, DEPDev and COA, and DPWH must publish cost-update reports on its website. COA publishes annual audit reports by agency and LGU, and its Citizen Participatory Audit lets civil society members join audit teams.",k:["GAA text: read what the law itself requires","COA Annual Audit Reports: findings for your LGU or agency","Citizen Participatory Audit: citizens inside audit teams"],links:[["COA: AAR for Local Government Units","https://www.coa.gov.ph/reports/annual-audit-reports/aar-local-government-units/"],["COA: CPA reports","https://www.coa.gov.ph/reports/citizen-participatory-audit-reports/"],["2026 GAA: DPWH provisions","https://www.dbm.gov.ph/wp-content/uploads/GAA/GAA2026/VolumeIB/DPWH/DPWH.pdf"]],qs:[{q:"Which source would show audit findings for your city's spending?",o:["COA Annual Audit Reports for LGUs","A movie trailer","Weather app","Sports site"],a:0,e:"COA posts LGU annual audit reports by year."},{q:"Under the 2026 GAA, who receives the flood control validation dashboard?",o:["DBM, DEPDev and COA","Only contractors","Only the media","Nobody"],a:0,e:"The GAA says findings are published through a dashboard shared with DBM, DEPDev and COA."}],u:"Being able to look is the start of accountability. Students who know where to look can ask better questions.",w:"COA has also said it will keep fraud audits going 'until we cover them all'. Public attention helps keep that momentum.",act:"Do a real lookup.",as:["Open COA's Annual Audit Reports for LGUs and pick the latest year and your city or province.","Search the report for words like 'infrastructure', 'drainage', or 'flood'. Write what you found or that you found nothing."]},
{c:"#9aa5b8",n:"Trust Check",s:"Numbers, claims and public trust",d:"Trust needs careful reading. Reports on the 2026 removal of locally funded flood control differ: ₱263.54B (DPWH/PIA), about ₱252B (Rappler), and ₱255.5B reallocated (PNA). Different documents count different stages (NEP, revisions, reallocation). In 2027, ₱107.4B is proposed for flood control again, framed as funding for ongoing projects. Budget watchdogs also warn that cutting one line item does not fix weak controls.",k:["Always cite which document a figure comes from and at what stage","Different numbers can come from different stages, not necessarily errors","Trust grows when claims are checkable"],links:[["SunStar: ₱255B removed from DPWH 2026 budget","https://www.sunstar.com.ph/manila/dpwh-drops-flood-control-funds-in-2026-budget"],["PIA: ₱263.54B excluded","https://pia.gov.ph/news/dpwh-institutes-reforms-under-reduced-budget-for-2026/"],["Inquirer: 2027 proposal","https://newsinfo.inquirer.net/2282813/flood-control-back-in-palaces-2027-budget-proposal"]],qs:[{q:"Why might reports give different totals for removed flood control funds?",o:["They count different stages or documents","Numbers change randomly","Journalists never check","Because of time zones"],a:0,e:"NEP, revised NEP and reallocation figures are different snapshots."},{q:"Best professional habit when quoting a budget number?",o:["Round it","Cite the document and stage it came from","Use the biggest one","Use the smallest one"],a:1,e:"Citing the source and stage lets others verify the figure."}],u:"Transparency is not just publishing numbers. It is making them traceable and comparable.",w:"As a future accountant, you will be the one reconciling figures like these.",act:"Reconcile two numbers.",as:["Take two flood control figures from the sources above.","Write one sentence explaining what stage each might represent, and what you would check to reconcile them."]},
{c:"#f0b400",n:"Audit Challenge",s:"Apply flood control budgeting",d:"Answer all five questions. Use the earlier cards as reference.",k:[],links:[["Review: COA Annual Audit Reports","https://www.coa.gov.ph/reports/annual-audit-reports/"]],qs:[{q:"What is the GAA?",o:["The proposal DBM submits","The enacted budget law","A COA report","A contract"],a:1,e:"The General Appropriations Act is the enacted budget."},{q:"₱881.31B proposed vs ₱530.89B enacted. What is the reduction?",o:["₱250.42B","₱350.42B","₱450.42B","₱100B"],a:1,e:"881.31 − 530.89 = 350.42."},{q:"A ₱80M contract shows 100% paid and 25% verified. Unsupported amount?",o:["₱20M","₱60M","₱80M","₱25M"],a:1,e:"Paid ₱80M minus verified ₱20M = ₱60M."},{q:"Which evidence best shows a structure existed before a contract?",o:["Historical satellite imagery","The contractor's brochure","A press release","A signed thank-you card"],a:0,e:"COA used historical satellite imagery."},{q:"A COA fraud audit report is...",o:["A final conviction","Evidence provided to bodies like the Ombudsman","A budget","A tax return"],a:1,e:"COA filed reports as evidence for further proceedings."}],u:"You now know the path of a flood control peso, the numbers, the evidence, and who answers for it.",w:"These are the same steps a practicing auditor follows.",act:"Plan your review.",as:["List the question you missed.","Return to that card and redo its Act task."]},
{c:"#c9a227",n:"Your Turn",s:"What you will do as a professional",d:"Accountants, engineers, procurement officers and business owners handle the paperwork behind projects like these. Concrete habits protect the public and protect you: verify before you sign, keep complete records, reconcile numbers to sources, and raise concerns early through proper channels such as COA and the Ombudsman.",k:["Verify before you certify","Keep complete, retrievable records","Cite the source and stage of every figure","Speak up early and follow proper channels"],links:[["COA homepage","https://www.coa.gov.ph/"],["COA: Citizen Participatory Audit","https://www.coa.gov.ph/FAQS/what-is-citizens-participatory-audit-cpa/"]],qs:[],u:"One professional who refuses to sign an unchecked payment can stop a much larger loss.",w:"Behind every ghost project were people who signed papers. Your signature will matter too.",act:"Write your commitment.",as:["Choose one habit from the list.","Describe the exact situation in your first job where you will use it, and what you will say if pressured to skip it."]}

 var D=ld("ttt_aq",{}),h=hub("Audit 101","What auditors actually do, and what happens after they find a problem.");
 h+='<div class="panel"><p class="stage">Four kinds of audit</p><details><summary><b>Financial</b>: are the reports fair?</summary><p>Checks whether an agency&#39;s financial statements fairly present its money and obligations.</p></details><details><summary><b>Compliance</b>: were the rules followed?</summary><p>Tests transactions against laws and rules, such as procurement. COA explains it on its <a target="_blank" rel="noopener" href="https://www.coa.gov.ph/wp-content/uploads/transparency/citizen_charter/COA_Citizens_Charter_Dec2021.pdf">FAQ page</a>.</p></details><details><summary><b>Performance</b>: did it work, and was it worth it?</summary><p>Looks at economy, efficiency and effectiveness of programs.</p></details><details><summary><b>Fraud</b>: was there deliberate deception?</summary><p>Investigates suspected fraud. In the Bulacan flood control work, COA used field inspections, drones and satellite images.</p></details></div>';
 h+='<div class="panel"><p class="stage">Audit opinions</p><ul><li><b>Unmodified:</b> statements fairly presented.</li><li><b>Qualified:</b> fair, except for specific problems.</li><li><b>Adverse:</b> statements are not fairly presented.</li><li><b>Disclaimer:</b> the auditor could not gather enough evidence to give an opinion.</li></ul></div>';
 h+='<div class="panel"><p class="stage">From finding to consequence</p><ol><li><b>Audit Observation Memorandum:</b> auditors flag an issue and ask officials to explain.</li><li><b>Notice of Suspension, Disallowance or Charge:</b> the payment is put on hold or refused, and responsible persons are identified.</li><li><b>Appeal:</b> those named can contest the decision within COA.</li><li><b>Court review:</b> COA decisions can be brought to the Supreme Court.</li></ol><p class="fb">Separate from this, fraud findings can go to the Ombudsman. An audit finding is not a conviction.</p></div>';
